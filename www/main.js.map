<header class="app-header">
  <button
    class="mode-toggle"
    (click)="toggleMode()"
    [title]="currentMode === 'preparation' ? 'Passer en mode réalisation' : 'Passer en mode préparation'"
  >
    <span *ngIf="currentMode === 'preparation'" class="icon">🛒</span>
    <span *ngIf="currentMode === 'shopping'" class="icon">✓</span>
  </button>

  <div class="font-controls">
    <button
      (click)="decreaseFontSize()"
      [disabled]="fontSize <= 12"
      title="Diminuer la taille du texte"
    >
      A-
    </button>
    <button
      (click)="increaseFontSize()"
      [disabled]="fontSize >= 24"
      title="Augmenter la taille du texte"
    >
      A+
    </button>
  </div>

  <div
    class="sync-indicator"
    [ngClass]="getSyncStatusClass()"
    [title]="getSyncStatusTitle()"
  >
    <span class="sync-dot"></span>
  </div>

  <button
    class="admin-button"
    (click)="goToAdmin()"
    title="Paramètres"
  >
    ⚙️
  </button>
</header>
