<app-header></app-header>

<div class="shopping-container">
  <div class="items-list">
    <div
      *ngFor="let item of shoppingItems"
      class="item-row"
      [ngClass]="getItemStatusClass(item)"
      (click)="toggleItemStatus(item)"
    >
      <div class="item-content">
        <span
          class="item-name"
          [class.strikethrough]="isStrikethrough(item)"
        >
          {{ item.name }}
        </span>

        <div class="item-info">
          <span class="quantity-badge">
            {{ item.quantity }}
          </span>
          <span class="status-text">
            {{ getItemStatusText(item) }}
          </span>
        </div>
      </div>
    </div>

    <div *ngIf="shoppingItems.length === 0" class="empty-state">
      <p>Aucun article à acheter</p>
      <p>Ajoutez des articles en mode préparation</p>
    </div>
  </div>
</div>
