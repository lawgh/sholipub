<app-header></app-header>

<div class="preparation-container">
  <div class="add-item-section">
    <input
      type="text"
      [(ngModel)]="newItemName"
      (keyup.enter)="addItem()"
      placeholder="Ajouter un article..."
      class="add-item-input"
    />
    <button
      (click)="addItem()"
      [disabled]="!newItemName.trim()"
      class="add-item-button"
    >
      +
    </button>
  </div>

  <div class="items-list">
    <div
      *ngFor="let item of items"
      class="item-row"
      [class.pending-sync]="item.pendingSync"
    >
      <div class="item-content">
        <div class="item-name-section">
          <input
            *ngIf="isEditing(item)"
            type="text"
            [(ngModel)]="editingItemName"
            (keyup.enter)="saveEditItem(item)"
            (keyup.escape)="cancelEditItem()"
            class="item-name-input"
            autofocus
          />
          <span
            *ngIf="!isEditing(item)"
            class="item-name"
            (click)="startEditItem(item)"
          >
            {{ item.name }}
          </span>
        </div>

        <div class="item-controls">
          <div class="quantity-controls">
            <button
              (click)="decreaseQuantity(item)"
              [disabled]="item.quantity <= 0"
              class="quantity-button"
            >
              -
            </button>
            <span class="quantity-display">{{ item.quantity }}</span>
            <button
              (click)="increaseQuantity(item)"
              [disabled]="item.quantity >= 1000"
              class="quantity-button"
            >
              +
            </button>
          </div>

          <div class="action-buttons">
            <button
              *ngIf="canMoveUp(item)"
              (click)="moveUp(item)"
              class="move-button"
              title="Monter"
            >
              ↑
            </button>
            <button
              *ngIf="canMoveDown(item)"
              (click)="moveDown(item)"
              class="move-button"
              title="Descendre"
            >
              ↓
            </button>
            <button
              (click)="deleteItem(item)"
              class="delete-button"
              title="Supprimer"
            >
              🗑️
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="isEditing(item)" class="edit-actions">
        <button (click)="saveEditItem(item)" class="save-button">
          Enregistrer
        </button>
        <button (click)="cancelEditItem()" class="cancel-button">
          Annuler
        </button>
      </div>
    </div>

    <div *ngIf="items.length === 0" class="empty-state">
      <p>Aucun article dans la liste</p>
      <p>Ajoutez des articles ci-dessus pour commencer</p>
    </div>
  </div>
</div>
