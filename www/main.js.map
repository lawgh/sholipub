<div class="auth-container">
  <h1>Liste de courses</h1>

  <div class="mode-switcher">
    <button
      [class.active]="mode === 'create'"
      (click)="switchMode('create')"
      [disabled]="loading"
    >
      Créer un compte
    </button>
    <button
      [class.active]="mode === 'join'"
      (click)="switchMode('join')"
      [disabled]="loading"
    >
      Rejoindre un compte
    </button>
  </div>

  <div class="auth-form" *ngIf="mode === 'create' && !generatedCode">
    <div class="form-group">
      <label for="create-pin">Code PIN (optionnel, 4 chiffres)</label>
      <input
        type="password"
        id="create-pin"
        [(ngModel)]="pin"
        maxlength="4"
        pattern="[0-9]*"
        placeholder="0000"
        [disabled]="loading"
      />
      <small>Le PIN protège votre compte. Laissez vide pour aucun PIN.</small>
    </div>

    <button
      class="primary-button"
      (click)="createAccount()"
      [disabled]="loading"
    >
      {{ loading ? 'Création...' : 'Créer le compte' }}
    </button>
  </div>

  <div class="auth-form" *ngIf="mode === 'create' && generatedCode">
    <div class="success-message">
      <h2>Compte créé avec succès!</h2>
      <p>Votre code d'accès est:</p>
      <div class="generated-code">
        {{ generatedCode }}
      </div>
      <button class="copy-button" (click)="copyCode()">
        Copier le code
      </button>
      <p class="redirect-message">Redirection automatique...</p>
    </div>
  </div>

  <div class="auth-form" *ngIf="mode === 'join'">
    <div class="form-group">
      <label for="join-code">Code du compte</label>
      <input
        type="text"
        id="join-code"
        [(ngModel)]="code"
        (input)="formatCodeInput()"
        maxlength="9"
        placeholder="XXXX-XXXX"
        [disabled]="loading"
      />
    </div>

    <div class="form-group">
      <label for="join-pin">Code PIN (si le compte en a un)</label>
      <input
        type="password"
        id="join-pin"
        [(ngModel)]="pin"
        maxlength="4"
        pattern="[0-9]*"
        placeholder="0000"
        [disabled]="loading"
      />
    </div>

    <button
      class="primary-button"
      (click)="joinAccount()"
      [disabled]="loading || !code"
    >
      {{ loading ? 'Connexion...' : 'Rejoindre le compte' }}
    </button>
  </div>

  <div class="error-message" *ngIf="error">
    {{ error }}
  </div>
</div>
